name: Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      # GitHub-hosted Ubuntu runners already include the Android SDK.
      # Accept SDK licences non-interactively to avoid the setup-android
      # action's interactive licence prompt in CI.
      - name: Accept Android SDK licences
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: z3x-finance-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

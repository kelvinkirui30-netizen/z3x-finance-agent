name: Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      Z3X_UPLOAD_KEYSTORE_BASE64: ${{ secrets.Z3X_UPLOAD_KEYSTORE_BASE64 }}
      Z3X_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.Z3X_UPLOAD_KEYSTORE_PASSWORD }}
      Z3X_UPLOAD_KEY_ALIAS: ${{ secrets.Z3X_UPLOAD_KEY_ALIAS }}
      Z3X_UPLOAD_KEY_PASSWORD: ${{ secrets.Z3X_UPLOAD_KEY_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --list_installed

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: z3x-finance-agent-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Prepare release keystore
        if: env.Z3X_UPLOAD_KEYSTORE_BASE64 != '' && env.Z3X_UPLOAD_KEYSTORE_PASSWORD != '' && env.Z3X_UPLOAD_KEY_ALIAS != '' && env.Z3X_UPLOAD_KEY_PASSWORD != ''
        run: |
          mkdir -p "$RUNNER_TEMP/z3x-signing"
          printf '%s' "$Z3X_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/z3x-signing/release.jks"
          chmod 600 "$RUNNER_TEMP/z3x-signing/release.jks"
          echo "Z3X_UPLOAD_KEYSTORE_PATH=$RUNNER_TEMP/z3x-signing/release.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        if: env.Z3X_UPLOAD_KEYSTORE_BASE64 != '' && env.Z3X_UPLOAD_KEYSTORE_PASSWORD != '' && env.Z3X_UPLOAD_KEY_ALIAS != '' && env.Z3X_UPLOAD_KEY_PASSWORD != ''
        run: gradle --no-daemon assembleRelease

      - name: Verify release APK signature
        if: env.Z3X_UPLOAD_KEYSTORE_BASE64 != '' && env.Z3X_UPLOAD_KEYSTORE_PASSWORD != '' && env.Z3X_UPLOAD_KEY_ALIAS != '' && env.Z3X_UPLOAD_KEY_PASSWORD != ''
        run: |
          APK="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"

      - name: Upload signed release APK
        if: env.Z3X_UPLOAD_KEYSTORE_BASE64 != '' && env.Z3X_UPLOAD_KEYSTORE_PASSWORD != '' && env.Z3X_UPLOAD_KEY_ALIAS != '' && env.Z3X_UPLOAD_KEY_PASSWORD != ''
        uses: actions/upload-artifact@v4
        with:
          name: z3x-finance-agent-signed-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Explain release signing is not configured yet
        if: env.Z3X_UPLOAD_KEYSTORE_BASE64 == '' || env.Z3X_UPLOAD_KEYSTORE_PASSWORD == '' || env.Z3X_UPLOAD_KEY_ALIAS == '' || env.Z3X_UPLOAD_KEY_PASSWORD == ''
        run: echo "Release signing secrets are not all configured. Debug APK was built; signed release APK was skipped."
